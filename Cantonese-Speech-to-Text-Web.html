<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廣東話語音轉文字 (Cantonese Speech-to-Text)</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Custom animation for the recording indicator */
        .recording-pulse {
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1055;
            display: none;
        }
        .textarea-container .btn-actions {
            position: absolute;
            top: 35px;
            right: 15px;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-4">
                    
                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4 position-relative border-0">
                        <h1 class="h3 fw-bold mb-1">廣東話語音輸入</h1>
                        <p class="mb-0 text-white-50">Cantonese Speech-to-Text</p>
                        
                        <!-- Status Indicator -->
                        <div class="position-absolute start-50 translate-middle-x" style="bottom: -12px;">
                            <span id="status-badge" class="badge bg-secondary rounded-pill shadow-sm px-3 py-2 border border-white text-uppercase tracking-wide">
                                <i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i> 準備就緒 (Ready)
                            </span>
                        </div>
                    </div>

                    <!-- Main Content Area -->
                    <div class="card-body p-4 p-md-5 pt-5">
                        
                        <!-- Browser Support Warning -->
                        <div id="unsupported-msg" class="alert alert-danger d-none text-center mb-4 shadow-sm" role="alert">
                            抱歉，您的瀏覽器不支援語音辨識功能。請使用 Google Chrome、Microsoft Edge 或 Safari。<br>
                            <small>(Sorry, your browser doesn't support the Web Speech API. Please use Chrome, Edge, or Safari.)</small>
                        </div>

                        <!-- Text Areas -->
                        <div class="d-flex flex-column gap-4">
                            
                            <!-- Final Text Area -->
                            <div class="position-relative textarea-container">
                                <label class="form-label fw-semibold text-secondary mb-2">已確認文字 (Final Text)</label>
                                <textarea id="transcript-output" 
                                    class="form-control bg-white shadow-sm fs-5 border-secondary-subtle" 
                                    rows="6"
                                    placeholder="辨識完成的文字會顯示在這裡... (Final transcribed text will appear here...)"></textarea>
                                
                                <!-- Action Buttons -->
                                <div class="btn-actions">
                                    <button id="btn-copy" class="btn btn-sm btn-light border shadow-sm text-primary me-1" title="複製文字 (Copy text)">
                                        <i class="bi bi-copy"></i>
                                    </button>
                                    <button id="btn-clear" class="btn btn-sm btn-light border shadow-sm text-danger" title="清空文字 (Clear text)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Interim Text Area -->
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-semibold text-secondary mb-0">即時聆聽中... (Live Interim Text)</label>
                                    <span class="badge bg-info text-dark rounded-pill shadow-sm">高準確度模式</span>
                                </div>
                                <div class="card bg-info bg-opacity-10 border-info border-opacity-25 shadow-sm">
                                    <div id="interim-output" class="card-body text-primary fst-italic py-3" style="min-height: 70px;">
                                        <span class="text-muted small not-italic">等待語音輸入...</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Controls -->
                        <div class="d-flex justify-content-center gap-3 mt-5">
                            <button id="btn-start" class="btn btn-primary btn-lg px-4 shadow-sm rounded-pill d-flex align-items-center gap-2">
                                <i class="bi bi-mic-fill"></i> 開始錄音
                            </button>
                            
                            <button id="btn-stop" disabled class="btn btn-secondary btn-lg px-4 shadow-sm rounded-pill d-flex align-items-center gap-2">
                                <i class="bi bi-stop-fill"></i> 停止
                            </button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast align-items-center text-bg-dark border-0 rounded-pill px-3 py-1 shadow" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-medium">
                <i class="bi bi-check-circle-fill me-2 text-success"></i>已複製到剪貼簿 (Copied to clipboard)
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            const btnClear = document.getElementById('btn-clear');
            const btnCopy = document.getElementById('btn-copy');
            const textArea = document.getElementById('transcript-output');
            const interimArea = document.getElementById('interim-output');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const statusContainer = document.getElementById('status-container');
            const unsupportedMsg = document.getElementById('unsupported-msg');
            const toast = document.getElementById('toast');

            let recognition;
            let isRecording = false;
            let finalTranscript = ''; // Stores committed sentences

            // Initialize Speech Recognition
			// 取得瀏覽器的語音辨識 API (支援 Chrome, Edge, Safari)
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
			   // 如果瀏覽器不支援，則顯示紅色的警告訊息 (unsupported-msg)
                unsupportedMsg.classList.remove('hidden');
				// 將「開始錄音」按鈕禁用，避免使用者點擊報錯
                btnStart.disabled = true;
                btnStart.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            recognition = new SpeechRecognition();
            // Set language to exact BCP-47 tag for Traditional Cantonese (Hong Kong)
			// 設定語言為最精確的香港廣東話 BCP-47 代
            recognition.lang = 'yue-Hant-HK'; 
			// 開啟連續辨識，讓系統不會在使用者停頓喘氣時自動停止錄音
            // Allow continuous recognition (don't stop automatically when user pauses)
            recognition.continuous = true; 
			// 開啟即時結果，讓使用者講話的當下能立刻看到尚未確認的動態文字
            // Show interim results before sentence is finished
            recognition.interimResults = true; 

            // --- Event Handlers for Speech Recognition ---

            recognition.onstart = () => {
                isRecording = true;
                updateUIState('recording');
            };

            recognition.onresult = (event) => { 
                let interimTranscript = ''; // 用於存放每次講話時尚未確認的「即時動態文字」

                // Loop through results
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        // Append the text and add two newlines for a paragraph break
						// 如果這句話已經被系統確認完畢 (isFinal 為 true)
						// 就把它加入到最終字串，並在句尾加上 '\n\n' 產生兩次換行（自動隔行排版）
                        finalTranscript += event.results[i][0].transcript + '\n\n';
                    } else {
						// 如果系統還在根據上下文判定中，就先放進即時動態文字中
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Update final text area with confirmed text
                textArea.value = finalTranscript;
                
                // Update interim area with live changing text
                if (interimTranscript.trim() !== '') {
                    interimArea.textContent = interimTranscript;
                } else {
                    interimArea.innerHTML = '<span class="text-slate-400 text-sm not-italic">等待語音輸入...</span>';
                }
                
                // Auto-scroll to bottom
                textArea.scrollTop = textArea.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMsg = '發生錯誤 (Error)';
                
                if (event.error === 'not-allowed') {
                    errorMsg = '麥克風被拒絕 (Mic access denied)';
                } else if (event.error === 'network') {
                    errorMsg = '網絡錯誤 (Network error)';
                }

                updateUIState('error', errorMsg);
            };

            recognition.onend = () => {
                isRecording = false;
                // If it ended automatically but wasn't stopped manually, we reset state
                updateUIState('stopped');
            };

            // --- Button Click Listeners ---

            btnStart.addEventListener('click', () => {
                if (isRecording) return;
                try {
                    // Update finalTranscript with whatever is currently in the text area
                    // so users can type and then append voice to it.
                    finalTranscript = textArea.value; 
                    recognition.start();
                } catch (e) {
                    console.error("Could not start recognition", e);
                }
            });

            btnStop.addEventListener('click', () => {
                if (!isRecording) return;
                recognition.stop();
                updateUIState('stopped');
                interimArea.innerHTML = '<span class="text-slate-400 text-sm not-italic">等待語音輸入...</span>';
            });

            btnClear.addEventListener('click', () => {
                textArea.value = '';
                finalTranscript = '';
                interimArea.innerHTML = '<span class="text-muted small not-italic">等待語音輸入...</span>';
                textArea.focus();
            });

            btnCopy.addEventListener('click', () => {
                if (!textArea.value) return;
                
                // Copy to clipboard
                textArea.select();
                textArea.setSelectionRange(0, 99999); // For mobile devices
                
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Failed to copy text', err);
                }
                
                // Deselect
                window.getSelection().removeAllRanges();
            });

            // --- Helper Functions ---

            function updateUIState(state, customMsg = null) {
                const statusBadge = document.getElementById('status-badge');
                
                switch(state) {
                    case 'recording':
                        statusBadge.className = 'badge bg-danger rounded-pill shadow px-3 py-2 border border-white recording-pulse';
                        statusBadge.innerHTML = '<i class="bi bi-record-circle-fill me-1"></i> 聆聽中... (Listening...)';
                        
                        btnStart.disabled = true;
                        btnStart.classList.replace('btn-primary', 'btn-secondary');
                        
                        btnStop.disabled = false;
                        btnStop.classList.replace('btn-secondary', 'btn-danger');
                        break;
                        
                    case 'stopped':
                        statusBadge.className = 'badge bg-secondary rounded-pill shadow-sm px-3 py-2 border border-white';
                        statusBadge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i> 準備就緒 (Ready)';
                        
                        btnStart.disabled = false;
                        btnStart.classList.replace('btn-secondary', 'btn-primary');
                        
                        btnStop.disabled = true;
                        btnStop.classList.replace('btn-danger', 'btn-secondary');
                        break;
                        
                    case 'error':
                        statusBadge.className = 'badge bg-danger rounded-pill shadow px-3 py-2 border border-white';
                        statusBadge.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> ' + (customMsg || '發生錯誤 (Error)');
                        
                        isRecording = false;
                        btnStart.disabled = false;
                        btnStart.classList.replace('btn-secondary', 'btn-primary');
                        
                        btnStop.disabled = true;
                        btnStop.classList.replace('btn-danger', 'btn-secondary');
                        break;
                }
            }

            function showToast() {
                const toastEl = document.getElementById('toast');
                toastEl.style.display = 'block';
                setTimeout(() => {
                    toastEl.style.display = 'none';
                }, 2000);
            }
        });
    </script>
</body>
</html>
