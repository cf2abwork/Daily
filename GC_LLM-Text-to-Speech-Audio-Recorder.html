<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS & Audio Recorder</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            resize: vertical;
        }
        .icon {
            width: 1.2rem;
            height: 1.2rem;
            vertical-align: text-bottom;
            margin-right: 0.4rem;
        }
    </style>
</head>
<body class="py-5">

    <div class="container app-container">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                
                <header class="mb-4 border-bottom pb-3">
                    <h1 class="h3 fw-bold text-dark">Text-to-Speech & Audio Recorder</h1>
                    <p class="text-secondary mb-0">Convert text to speech and export as local audio using Bootstrap 5.</p>
                </header>

                <!-- Alerts -->
                <div id="errorBox" class="alert alert-danger d-none" role="alert">
                    <span id="errorMessage"></span>
                </div>
                <div id="infoBox" class="alert alert-info d-none" role="alert">
                    <span id="infoMessage"></span>
                </div>

                <div class="row g-4">
                    <!-- Text Input -->
                    <div class="col-12">
                        <label for="textInput" class="form-label fw-bold">Text to Speak</label>
                        <textarea id="textInput" rows="5" class="form-control rounded-3">這是一段測試語音。我們在此結合了廣東話與國語的常見用語。
Cantonese and Mandarin mix: 唔該晒，謝謝您的幫忙！
Life is a journey, enjoy the ride.</textarea>
                    </div>

                    <!-- Controls Grid -->
                    <div class="col-12 bg-light p-4 rounded-3 border">
                        <div class="row g-3">
                            
                            <!-- Expanded Voice Selection -->
                            <div class="col-12">
                                <label for="langSelect" class="form-label fw-bold">Voice / Language</label>
                                <select id="langSelect" class="form-select rounded-3 cursor-pointer">
                                    <optgroup label="Cantonese (廣東話)">
                                        <option value="zh-HK">Hong Kong Cantonese (zh-HK)</option>
                                        <option value="yue-HK">Hong Kong Cantonese - Apple/Mac (yue-HK)</option>
                                        <option value="zh-MO">Macau Cantonese (zh-MO)</option>
                                        <option value="yue-CN">Mainland Cantonese (yue-CN)</option>
                                    </optgroup>
                                    <optgroup label="Mandarin (國語 / 普通話)">
                                        <option value="zh-TW">Taiwan Mandarin / Traditional (zh-TW)</option>
                                        <option value="zh-CN">Mainland China Mandarin (zh-CN)</option>
                                        <option value="zh-SG">Singapore Mandarin (zh-SG)</option>
                                    </optgroup>
                                    <optgroup label="English">
                                        <option value="en-US">US English (en-US)</option>
                                        <option value="en-GB">UK / British English (en-GB)</option>
                                        <option value="en-AU">Australian English (en-AU)</option>
                                        <option value="en-CA">Canadian English (en-CA)</option>
                                        <option value="en-IN">Indian English (en-IN)</option>
                                        <option value="en-IE">Irish English (en-IE)</option>
                                        <option value="en-ZA">South African English (en-ZA)</option>
                                    </optgroup>
                                </select>
                            </div>

                            <!-- Rate Slider -->
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <label for="rateSlider" class="form-label fw-bold mb-0">Speed</label>
                                    <span id="rateValue" class="text-secondary font-monospace">1.0x</span>
                                </div>
                                <input type="range" id="rateSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="form-range">
                            </div>

                            <!-- Pitch Slider -->
                            <div class="col-md-6">
                                <div class="d-flex justify-content-between mb-1">
                                    <label for="pitchSlider" class="form-label fw-bold mb-0">Pitch</label>
                                    <span id="pitchValue" class="text-secondary font-monospace">1.0</span>
                                </div>
                                <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="form-range">
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="col-12 d-flex flex-column flex-md-row gap-2 mt-2">
                        <button id="btnSpeak" class="btn btn-primary flex-grow-1 py-2 fw-bold rounded-3">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Speak (Native)
                        </button>
                        <button id="btnStop" class="btn btn-secondary py-2 px-4 fw-bold rounded-3">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                            Stop
                        </button>
                        <button id="btnRecord" class="btn btn-success flex-grow-1 py-2 fw-bold rounded-3">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            Record & Save
                        </button>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // DOM Elements
        const textInput = document.getElementById('textInput');
        const langSelect = document.getElementById('langSelect');
        const rateSlider = document.getElementById('rateSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const rateValue = document.getElementById('rateValue');
        const pitchValue = document.getElementById('pitchValue');
        const btnSpeak = document.getElementById('btnSpeak');
        const btnStop = document.getElementById('btnStop');
        const btnRecord = document.getElementById('btnRecord');
        const errorBox = document.getElementById('errorBox');
        const errorMessage = document.getElementById('errorMessage');
        const infoBox = document.getElementById('infoBox');
        const infoMessage = document.getElementById('infoMessage');

        // State
        let availableVoices = [];
        let isRecordingProcess = false;

        // Initialize Voices
        const populateVoices = () => {
            availableVoices = speechSynthesis.getVoices();
        };
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // Update Slider Labels
        rateSlider.addEventListener('input', (e) => rateValue.textContent = `${parseFloat(e.target.value).toFixed(1)}x`);
        pitchSlider.addEventListener('input', (e) => pitchValue.textContent = parseFloat(e.target.value).toFixed(1));

        // UI Helpers (Bootstrap d-none class for toggling)
        const showError = (msg) => {
            errorMessage.textContent = msg;
            errorBox.classList.remove('d-none');
            setTimeout(() => errorBox.classList.add('d-none'), 8000);
        };
        const showInfo = (msg) => {
            infoMessage.textContent = msg;
            infoBox.classList.remove('d-none');
            setTimeout(() => infoBox.classList.add('d-none'), 5000);
        };

        // Voice Matching Logic
        function getBestVoice(targetLang) {
            if (!availableVoices.length) return null;
            
            // 1. Try exact match (including yue-HK or zh-HK variants)
            let match = availableVoices.find(v => v.lang === targetLang || v.lang.replace('_', '-') === targetLang);
            if (match) return match;
            
            // 2. Fallback: match base language (e.g., 'zh' for 'zh-HK', 'en' for 'en-GB')
            const baseLang = targetLang.split('-')[0];
            match = availableVoices.find(v => v.lang.startsWith(baseLang));
            return match || availableVoices[0];
        }

        // Core Speak Function
        function speakText(recorder = null) {
            speechSynthesis.cancel();
            
            const text = textInput.value.trim();
            if (!text) {
                showError("Please enter some text to speak.");
                if (recorder) recorder.stop();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const targetLang = langSelect.value;
            
            const selectedVoice = getBestVoice(targetLang);
            if (selectedVoice) utterance.voice = selectedVoice;
            
            utterance.lang = targetLang;
            utterance.rate = parseFloat(rateSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value);

            // Handle recording lifecycle sync
            if (recorder) {
                utterance.onend = () => {
                    if (recorder.state !== 'inactive') recorder.stop();
                };
                utterance.onerror = (e) => {
                    console.error("SpeechSynthesis Error:", e);
                    if (recorder.state !== 'inactive') recorder.stop();
                    showError("Speech synthesis interrupted or failed.");
                };
            }

            speechSynthesis.speak(utterance);
        }

        // Button Listeners
        btnSpeak.addEventListener('click', () => speakText(null));
        
        btnStop.addEventListener('click', () => {
            speechSynthesis.cancel();
            if (isRecordingProcess) {
                showInfo("Recording forcefully stopped.");
            }
        });

        // Record & Save Logic
        btnRecord.addEventListener('click', async () => {
            if (isRecordingProcess) return;
            
            try {
                isRecordingProcess = true;
                showInfo("Please select 'Share this tab' and ensure 'Share audio' is toggled ON.");

                // Request display media to capture tab audio
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length === 0) {
                    stream.getTracks().forEach(track => track.stop());
                    throw new Error("No audio track found. Please check 'Share audio' in the permissions dialog.");
                }

                showInfo("Recording started... Audio will download automatically when finished.");

                // Create isolated audio stream
                const audioStream = new MediaStream([audioTracks[0]]);
                
                // Determine format support
                const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' 
                               : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' 
                               : '';
                               
                const mediaRecorder = new MediaRecorder(audioStream, { mimeType });
                const chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    isRecordingProcess = false;
                    
                    // Stop tracks to close browser recording indicator
                    stream.getTracks().forEach(track => track.stop());
                    audioStream.getTracks().forEach(track => track.stop());

                    if (chunks.length === 0) {
                        showError("Failed to capture audio data.");
                        return;
                    }

                    // Create file and download
                    const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                    
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `tts-recording-${Date.now()}.${ext}`;
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                    
                    showInfo("Audio saved successfully!");
                };

                mediaRecorder.start();
                speakText(mediaRecorder);

            } catch (err) {
                isRecordingProcess = false;
                console.error("Recording error:", err);
                if (err.name === 'NotAllowedError') {
                    showError("Permission denied. Screen/Audio sharing is required for saving.");
                } else {
                    showError(err.message || "An error occurred while attempting to record.");
                }
            }
        });
    </script>
</body>
</html>
